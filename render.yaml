services:
  - type: web
    name: openclaw-bot
    env: node
    plan: free
    buildCommand: "npm install"
    startCommand: "openclaw gateway --port 10000 --allow-unconfigured"
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: OPENCLAW_CHANNELS_TELEGRAM_ENABLED
        value: "true"
      - key: OPENCLAW_CHANNELS_TELEGRAM_TOKEN
        sync: false
